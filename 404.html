<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Bar du Léo</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1e6;color:#193b2d;font-family:Figtree,system-ui,sans-serif;text-align:center;padding:24px}
    h1{font-family:Fraunces,Georgia,serif;font-size:2.4rem;margin:0 0 8px}
    p{color:#5a665f;margin:0 0 22px}
    a{display:inline-block;background:#1f6547;color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:8px}
    a:hover{background:#174b36}
  </style>
</head>
<body>
  <main>
    <h1>Página não encontrada</h1>
    <p>O endereço que você tentou abrir não existe no site do Bar du Léo.</p>
    <a id="home" href="/">Voltar ao cardápio</a>
  </main>
  <script>
    /* No GitHub Pages de projeto o site fica em /nome-do-repositorio/ */
    (function () {
      var p = location.pathname.split("/").filter(Boolean);
      var base = /\.github\.io$/.test(location.hostname) && p.length ? "/" + p[0] + "/" : "/";
      document.getElementById("home").href = base;
    })();
  </script>
</body>
</html>
